<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Cosmic Explorer — Full Universe</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00020a;--panel:#010511;--border:#0a1736;--border2:#152248;
  --c1:#5ecfda;--c2:#9b4dca;--gold:#f0c040;--red:#e85050;
  --green:#3de89a;--orange:#f07830;--pink:#e060a0;
  --text:#aec8f0;--dim:#2e4070;--dim2:#1a2d55;
}
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;cursor:crosshair;}

/* LAYOUT */
#shell{display:flex;flex-direction:column;width:100vw;height:100vh;}

/* TOPBAR */
#topbar{
  height:50px;background:var(--panel);border-bottom:1px solid var(--border);
  display:flex;align-items:center;padding:0 16px;gap:0;flex-shrink:0;z-index:200;
}
.logo{font-family:'Orbitron',monospace;font-size:.8rem;font-weight:900;letter-spacing:3px;color:var(--c1);padding-right:16px;border-right:1px solid var(--border2);white-space:nowrap;}
.nav-tabs{display:flex;gap:2px;padding:0 12px;}
.ntab{
  font-family:'Orbitron',monospace;font-size:.58rem;letter-spacing:1.5px;text-transform:uppercase;
  background:transparent;border:1px solid transparent;color:var(--dim);cursor:pointer;
  padding:5px 12px;border-radius:3px;transition:all .18s;white-space:nowrap;
}
.ntab:hover{color:var(--text);}
.ntab.active{background:rgba(94,207,218,.08);color:var(--c1);border-color:rgba(94,207,218,.2);}
.nav-sp{flex:1;}
.simclock{display:flex;align-items:center;gap:6px;font-size:.68rem;color:var(--dim);padding-left:14px;border-left:1px solid var(--border2);}
.scdot{width:5px;height:5px;border-radius:50%;background:var(--green);box-shadow:0 0 6px var(--green);animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}
.scval{font-family:'Orbitron',monospace;font-size:.68rem;color:var(--c1);}

/* MAIN */
#main{display:flex;flex:1;overflow:hidden;}

/* SIDEBAR */
#sidebar{width:300px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;z-index:10;}

/* Category filter bar */
#catbar{display:flex;flex-wrap:wrap;gap:3px;padding:8px 10px;border-bottom:1px solid var(--border);background:#010816;}
.catbtn{
  font-family:'Orbitron',monospace;font-size:.52rem;letter-spacing:1px;text-transform:uppercase;
  background:transparent;border:1px solid var(--border2);color:var(--dim);cursor:pointer;
  padding:3px 8px;border-radius:2px;transition:all .15s;white-space:nowrap;
}
.catbtn:hover{color:var(--text);border-color:var(--dim);}
.catbtn.on{color:var(--bg);border-color:transparent;}

/* Object list */
#objlist{flex:1;overflow-y:auto;padding:4px 0;}
#objlist::-webkit-scrollbar{width:3px;}
#objlist::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px;}
.listsec{padding:6px 14px 3px;font-family:'Orbitron',monospace;font-size:.54rem;letter-spacing:2px;color:var(--dim);text-transform:uppercase;border-bottom:1px solid var(--border);margin-top:2px;}
.objrow{
  display:flex;align-items:center;gap:9px;padding:7px 14px;cursor:pointer;
  border-left:3px solid transparent;transition:all .14s;
}
.objrow:hover{background:rgba(94,207,218,.04);border-left-color:var(--c1);}
.objrow.sel{background:rgba(240,192,64,.05);border-left-color:var(--gold);}
.oicon{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;}
.oinfo{flex:1;min-width:0;}
.oname{font-family:'Orbitron',monospace;font-size:.65rem;font-weight:700;letter-spacing:.8px;color:var(--text);text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.objrow.sel .oname{color:var(--gold);}
.osub{font-size:.6rem;color:var(--dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.otype-badge{font-family:'Orbitron',monospace;font-size:.5rem;padding:1px 5px;border-radius:2px;flex-shrink:0;white-space:nowrap;}

/* INFO PANEL */
#infopanel{border-top:1px solid var(--border);background:#010510;flex-shrink:0;max-height:52%;overflow-y:auto;padding:14px 16px 18px;}
#infopanel::-webkit-scrollbar{width:3px;}
#infopanel::-webkit-scrollbar-thumb{background:var(--border2);}
.itype{font-family:'Orbitron',monospace;font-size:.54rem;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:3px;}
.iname{font-family:'Orbitron',monospace;font-size:1rem;font-weight:900;color:var(--gold);letter-spacing:1px;margin-bottom:8px;line-height:1.2;}
.ifact{font-size:.8rem;line-height:1.6;color:#6888b8;margin-bottom:10px;}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.statbox{background:#020b1e;border:1px solid var(--border);border-radius:5px;padding:7px 10px;}
.slbl{font-size:.54rem;color:var(--dim);text-transform:uppercase;letter-spacing:1px;}
.sv{font-family:'Orbitron',monospace;font-size:.68rem;color:var(--c1);margin-top:2px;line-height:1.3;}
.sublist{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;}
.subchip{font-family:'Orbitron',monospace;font-size:.56rem;padding:3px 9px;border-radius:2px;border:1px solid var(--border2);color:var(--text);cursor:pointer;transition:all .13s;background:#010c22;}
.subchip:hover{border-color:var(--c1);color:var(--c1);}

/* CANVAS */
#cwrap{flex:1;position:relative;overflow:hidden;background:radial-gradient(ellipse 70% 50% at 50% 55%,#030d28,#00020a);}
#cwrap canvas{display:block;width:100%!important;height:100%!important;}

/* TOOLBAR */
#toolbar{
  position:absolute;bottom:0;left:0;right:0;height:50px;
  background:rgba(1,5,17,.9);backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:0 16px;z-index:20;overflow-x:auto;
}
.tsep{width:1px;height:30px;background:var(--border2);flex-shrink:0;}
.tlbl{font-family:'Orbitron',monospace;font-size:.54rem;letter-spacing:2px;color:var(--dim);white-space:nowrap;}
input[type=range]{-webkit-appearance:none;width:110px;height:3px;background:var(--border2);border-radius:3px;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 8px var(--gold);}
.tv{font-family:'Orbitron',monospace;font-size:.62rem;color:var(--c1);min-width:36px;}
.tbtn{font-family:'Orbitron',monospace;font-size:.54rem;letter-spacing:1px;text-transform:uppercase;background:transparent;border:1px solid var(--border2);color:var(--dim);padding:5px 11px;border-radius:3px;cursor:pointer;transition:all .16s;white-space:nowrap;flex-shrink:0;}
.tbtn:hover{border-color:var(--c1);color:var(--c1);}
.tbtn.on{border-color:var(--gold);color:var(--gold);background:rgba(240,192,64,.07);}
.tbtn.lk{border-color:var(--c2);color:var(--c2);background:rgba(155,77,202,.08);}

/* tooltip */
#tip{position:absolute;pointer-events:none;background:rgba(1,5,17,.94);border:1px solid var(--border2);border-radius:5px;padding:5px 11px;font-family:'Orbitron',monospace;font-size:.62rem;color:var(--c1);letter-spacing:1px;display:none;z-index:50;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.5);}

/* ripple */
.ripple{position:absolute;border-radius:50%;border:1px solid var(--c1);pointer-events:none;animation:ro .5s ease-out forwards;}
@keyframes ro{from{width:0;height:0;opacity:.9;transform:translate(-50%,-50%);}to{width:64px;height:64px;opacity:0;transform:translate(-50%,-50%);}}

@media(max-width:740px){
  #sidebar{width:100%;height:38%;flex-direction:column;}
  #main{flex-direction:column;}
  #infopanel{display:none;}
  #cwrap{flex:1;}
}
</style>
</head>
<body>
<div id="shell">
<div id="topbar">
  <div class="logo">⬡ COSMIC EXPLORER</div>
  <div class="nav-tabs">
    <button class="ntab active" id="tab-solar"   onclick="setView('solar')">☀ Solar System</button>
    <button class="ntab"        id="tab-outer"   onclick="setView('outer')">❄ Outer Solar</button>
    <button class="ntab"        id="tab-stars"   onclick="setView('stars')">✦ Nearby Stars</button>
    <button class="ntab"        id="tab-deep"    onclick="setView('deep')">🌌 Deep Space</button>
  </div>
  <div class="nav-sp"></div>
  <div class="simclock">
    <div class="scdot"></div>
    <span class="scval" id="ck-d">0</span><span>&nbsp;days</span>
    <span>&nbsp;/&nbsp;</span>
    <span class="scval" id="ck-y">0.00</span><span>&nbsp;yrs</span>
  </div>
</div>
<div id="main">
  <aside id="sidebar">
    <div id="catbar"></div>
    <div id="objlist"></div>
    <div id="infopanel">
      <div class="itype" id="i-type">SELECT AN OBJECT</div>
      <div class="iname" id="i-name">—</div>
      <div class="ifact" id="i-fact">Click any object in the 3D view or the list to discover facts and data.</div>
      <div class="statgrid" id="i-stats"></div>
      <div class="sublist" id="i-subs"></div>
    </div>
  </aside>
  <div id="cwrap"><div id="tip"></div></div>
</div>
</div>

<script>
// inject toolbar
document.getElementById('cwrap').insertAdjacentHTML('beforeend',`
<div id="toolbar">
  <span class="tlbl">Speed</span>
  <input type="range" id="spd" min="0" max="3.5" step="0.01" value="1">
  <span class="tv" id="spd-v">1.00×</span>
  <div class="tsep"></div>
  <button class="tbtn" id="b-reset">↺ Reset</button>
  <button class="tbtn" id="b-lock">⊙ Lock</button>
  <button class="tbtn" id="b-orbits">Orbits</button>
  <button class="tbtn" id="b-labels">Labels</button>
  <button class="tbtn" id="b-tails">Tails</button>
  <div class="tsep"></div>
  <button class="tbtn" id="b-top">Top</button>
  <button class="tbtn" id="b-side">Side</button>
</div>`);
</script>

// THREE.JS SCENE SETUP
// ════════════════════════════════════════════════════
const cwrap=document.getElementById('cwrap');
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,.01,10000);
camera.position.set(0,28,62);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
cwrap.insertBefore(renderer.domElement,document.getElementById('tip'));

const labelR=new CSS2DRenderer();
labelR.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none;overflow:hidden;';
cwrap.insertBefore(labelR.domElement,document.getElementById('tip'));

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.06;
controls.zoomSpeed=1.1; controls.rotateSpeed=0.7;
controls.minDistance=1; controls.maxDistance=2000;

// Lights
scene.add(new THREE.AmbientLight(0x0a1028,3));
const sunLight=new THREE.PointLight(0xffddaa,2.5,300,1.2);
scene.add(sunLight);

// Starfield
(()=>{
  const geo=new THREE.BufferGeometry();
  const n=6000,pos=new Float32Array(n*3);
  for(let i=0;i<n;i++){
    const r=500+Math.random()*1500;
    const phi=Math.acos(2*Math.random()-1);
    const th=Math.random()*Math.PI*2;
    pos[i*3]=r*Math.sin(phi)*Math.cos(th);
    pos[i*3+1]=r*Math.sin(phi)*Math.sin(th);
    pos[i*3+2]=r*Math.cos(phi);
  }
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  scene.add(new THREE.Points(geo,new THREE.PointsMaterial({color:0xffffff,size:.5,transparent:true,opacity:.65,sizeAttenuation:true})));
})();

Object.values(groups).forEach(g=>{scene.add(g);g.visible=false;});

const allMeshMap={}; // id->mesh
const orbitLines=[];
let cometTails=[];
let showOrbits=true,showLabels=true,showTails=true;

function makeLabel(text,color,size=10){
  const d=document.createElement('div');
  d.textContent=text.toUpperCase();
  d.style.cssText=`font-family:'Orbitron',monospace;font-size:${size}px;font-weight:700;color:${color};letter-spacing:1.5px;pointer-events:none;white-space:nowrap;padding:2px 7px;background:rgba(0,2,10,.7);border-radius:3px;border:1px solid ${color}44;text-shadow:0 0 10px ${color}66;`;
  return new CSS2DObject(d);
}

function hexColor(col){return'#'+col.toString(16).padStart(6,'0');}

function makeOrbitRing(dist,tilt=0,col=0x0a1736){
  const pts=[];
  for(let i=0;i<=256;i++){const a=(i/256)*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*dist,0,Math.sin(a)*dist));}
  const line=new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.45}));
  line.rotation.x=tilt;
  return line;
}

function makeGlowSphere(r,col,intensity=0.12){
  const m=new THREE.Mesh(
    new THREE.SphereGeometry(r*1.4,16,16),
    new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:intensity,side:THREE.BackSide})
  );
  return m;
}

function makeCometTail(mesh,col){
  const pts=[];
  for(let i=0;i<40;i++) pts.push(new THREE.Vector3(0,0,0));
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat=new THREE.LineBasicMaterial({color:col,transparent:true,opacity:.5,vertexColors:false});
  const line=new THREE.Line(geo,mat);
  scene.add(line);
  cometTails.push({line,mesh,col});
  return line;
}

function makeNebulaCloud(r,col,glowCol){
  const group=new THREE.Group();
  // Multiple transparent overlapping spheres for cloud look
  const colors=[col,glowCol,0xffffff];
  [[r,0.07],[r*.75,0.09],[r*.5,0.06],[r*1.2,0.04]].forEach(([rad,op],i)=>{
    const m=new THREE.Mesh(
      new THREE.SphereGeometry(rad,20,20),
      new THREE.MeshBasicMaterial({color:colors[i%colors.length]||col,transparent:true,opacity:op,side:THREE.DoubleSide,depthWrite:false})
    );
    m.rotation.set(Math.random()*Math.PI,Math.random()*Math.PI,0);
    group.add(m);
  });
  return group;
}

// BUILD SOLAR GROUP
// ════════════════════════════════════════════════════
const SIM_START=performance.now();
const DAYS_MS=365/1000;
let simSpeed=1.0;
function eDays(){return(performance.now()-SIM_START)*DAYS_MS*simSpeed;}
function oAngle(d,p){return((d/p)%1)*Math.PI*2;}

DB.solar.forEach(p=>{
  const geo=new THREE.SphereGeometry(p.r,48,48);
  const mat=p.emissive
    ? new THREE.MeshStandardMaterial({color:p.col,emissive:p.emissive,emissiveIntensity:1.1,roughness:1,metalness:0})
    : new THREE.MeshStandardMaterial({color:p.col,roughness:.5,metalness:.05});
  const m=new THREE.Mesh(geo,mat);
  m.userData={id:p.id,view:'solar'};
  groups.solar.add(m);
  allMeshMap[p.id]=m;

  if(p.emissive){ m.add(makeGlowSphere(p.r,p.emissive,.15)); }

  const lbl=makeLabel(p.name,p.emissive?'#ffaa44':hexColor(p.col));
  lbl.position.y=p.r+.7;
  m.add(lbl);

  if(p.hasRings){
    const ring=new THREE.Mesh(new THREE.RingGeometry(p.r*1.4,p.r*2.5,80),new THREE.MeshBasicMaterial({color:0xd4bb88,side:THREE.DoubleSide,transparent:true,opacity:.55}));
    ring.rotation.x=Math.PI/2.5; m.add(ring);
  }

  if(p.dist>0 && !p.moonOf){
    const ol=makeOrbitRing(p.dist);
    groups.solar.add(ol); orbitLines.push(ol);
  }
});

// ════════════════════════════════════════════════════
// BUILD OUTER GROUP
// ════════════════════════════════════════════════════
DB.outer.forEach(p=>{
  let m;
  if(p.isComet&&!p.id.includes('borisov')&&!p.id.includes('oumuamua')){
    // comet nucleus
    const geo=new THREE.SphereGeometry(p.r,24,24);
    const mat=new THREE.MeshStandardMaterial({color:p.col,emissive:p.col,emissiveIntensity:.4,roughness:.9});
    m=new THREE.Mesh(geo,mat);
    makeCometTail(m,p.col);
  } else if(p.elongated){
    const geo=new THREE.SphereGeometry(p.r,32,16);
    const mat=new THREE.MeshStandardMaterial({color:p.col,roughness:.7});
    m=new THREE.Mesh(geo,mat);
    m.scale.set(1.8,1,1);
  } else {
    const geo=new THREE.SphereGeometry(p.r,40,40);
    const mat=p.cat==='interstellar'
      ? new THREE.MeshStandardMaterial({color:p.col,emissive:p.col,emissiveIntensity:.5,roughness:.8})
      : new THREE.MeshStandardMaterial({color:p.col,roughness:.6,metalness:.05});
    m=new THREE.Mesh(geo,mat);
  }
  m.userData={id:p.id,view:'outer'};
  groups.outer.add(m);
  allMeshMap[p.id]=m;

  const lbl=makeLabel(p.name,hexColor(p.col),9);
  lbl.position.y=p.r+.6;
  m.add(lbl);

  if(p.dist>0 && !p.moonOf){
    const tilt=p.orbitTilt||0;
    const ol=makeOrbitRing(p.dist,tilt,p.cat==='comet'?0x224455:0x0a1736);
    groups.outer.add(ol); orbitLines.push(ol);
  }
});

// BUILD STARS GROUP
// ════════════════════════════════════════════════════
const LY=7;
DB.stars.forEach(s=>{
  const geo=new THREE.SphereGeometry(s.r,32,32);
  const mat=new THREE.MeshStandardMaterial({color:s.col,emissive:s.col,emissiveIntensity:.8,roughness:1,metalness:0});
  const m=new THREE.Mesh(geo,mat);
  m.position.set(s.pos[0]*LY,s.pos[1]*LY,s.pos[2]*LY);
  m.userData={id:s.id,view:'stars'};
  groups.stars.add(m);
  allMeshMap[s.id]=m;
  m.add(makeGlowSphere(s.r,s.col,.1));

  const lbl=makeLabel(s.name,hexColor(s.col),10);
  lbl.position.y=s.r+.8;
  m.add(lbl);

  // distance line from Sol
  if(s.id!=='sol2'){
    const lpts=[new THREE.Vector3(0,0,0),m.position.clone()];
    groups.stars.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(lpts),new THREE.LineBasicMaterial({color:0x0a1736,transparent:true,opacity:.25})));
  }
});

// ════════════════════════════════════════════════════
// BUILD DEEP GROUP
// ════════════════════════════════════════════════════
DB.deep.forEach(d=>{
  let m;
  const pos=new THREE.Vector3(...d.pos);
  const lc=d.glowCol||d.col;

  if(d.cat==='nebula'){
    const grp=makeNebulaCloud(d.r,d.col,lc);
    grp.position.copy(pos);
    grp.userData={id:d.id,view:'deep'};
    groups.deep.add(grp);
    allMeshMap[d.id]=grp;
    // invisible click target
    const clickM=new THREE.Mesh(new THREE.SphereGeometry(d.r*.8,8,8),new THREE.MeshBasicMaterial({transparent:true,opacity:0}));
    clickM.userData={id:d.id,view:'deep'};
    grp.add(clickM);
    const lbl=makeLabel(d.name,hexColor(d.col),10);
    lbl.position.y=d.r+1;
    grp.add(lbl);
    return;
  }

  if(d.cat==='blackhole'){
    const geo=new THREE.SphereGeometry(d.r,32,32);
    const mat=new THREE.MeshBasicMaterial({color:0x000000});
    m=new THREE.Mesh(geo,mat);
    // accretion disk ring
    const ring=new THREE.Mesh(
      new THREE.RingGeometry(d.r*1.3,d.r*2.8,64),
      new THREE.MeshBasicMaterial({color:d.col,side:THREE.DoubleSide,transparent:true,opacity:.6})
    );
    ring.rotation.x=Math.PI/4; m.add(ring);
    m.add(makeGlowSphere(d.r,d.col,.18));
  } else if(d.cat==='galaxy'){
    // galaxy: flat disk shape
    const geo=new THREE.CylinderGeometry(d.r,d.r*.4,.8,32);
    const mat=new THREE.MeshBasicMaterial({color:d.col,transparent:true,opacity:.55});
    m=new THREE.Mesh(geo,mat);
    // glow
    m.add(makeGlowSphere(d.r*.8,d.glowCol||d.col,.12));
    // spiral hint rings
    [[d.r*.4,.1],[d.r*.7,.07],[d.r*.95,.05]].forEach(([r,op])=>{
      const ring=new THREE.Mesh(new THREE.RingGeometry(r*.85,r,40),new THREE.MeshBasicMaterial({color:d.col,side:THREE.DoubleSide,transparent:true,opacity:op}));
      ring.rotation.x=Math.PI/2; m.add(ring);
    });
  } else {
    const geo=new THREE.SphereGeometry(d.r,24,24);
    const mat=new THREE.MeshStandardMaterial({color:d.col,emissive:d.col,emissiveIntensity:.5,roughness:.8});
    m=new THREE.Mesh(geo,mat);
  }

  m.position.copy(pos);
  m.userData={id:d.id,view:'deep'};
  groups.deep.add(m);
  allMeshMap[d.id]=m;

  const lbl=makeLabel(d.name,hexColor(d.col),10);
  lbl.position.y=d.r+1;
  m.add(lbl);
});

// SIDEBAR LOGIC
// ════════════════════════════════════════════════════
let currentView='solar';
let activeCats=new Set();
let selectedId=null;
let focusLocked=false;

function getAllForView(v){
  if(v==='solar')  return DB.solar;
  if(v==='outer')  return DB.outer;
  if(v==='stars')  return DB.stars;
  if(v==='deep')   return DB.deep;
  return [];
}

function buildCatBar(v){
  const bar=document.getElementById('catbar');
  bar.innerHTML='';
  const cats=[...new Set(getAllForView(v).map(x=>x.cat))];
  activeCats=new Set(cats);
  const all=document.createElement('button');
  all.className='catbtn on';
  all.textContent='All';
  all.style.background=CATS['planet']?.color||'#5ecfda';
  all.style.color='#00020a';
  all.addEventListener('click',()=>{
    activeCats=new Set(cats);
    document.querySelectorAll('.catbtn').forEach(b=>b.classList.add('on'));
    buildObjList(v);
  });
  bar.appendChild(all);
  cats.forEach(c=>{
    const ct=CATS[c];if(!ct)return;
    const btn=document.createElement('button');
    btn.className='catbtn on';
    btn.textContent=ct.label;
    btn.style.background=ct.color;
    btn.style.color='#00020a';
    btn.dataset.cat=c;
    btn.addEventListener('click',()=>{
      if(activeCats.has(c)){activeCats.delete(c);btn.classList.remove('on');btn.style.background='transparent';btn.style.color=ct.color;}
      else{activeCats.add(c);btn.classList.add('on');btn.style.background=ct.color;btn.style.color='#00020a';}
      buildObjList(v);
    });
    bar.appendChild(btn);
  });
}

function buildObjList(v){
  const el=document.getElementById('objlist');
  el.innerHTML='';
  const items=getAllForView(v).filter(x=>activeCats.has(x.cat));

  // group by cat
  const byCat={};
  items.forEach(x=>{if(!byCat[x.cat])byCat[x.cat]=[];byCat[x.cat].push(x);});

  Object.entries(byCat).forEach(([cat,objs])=>{
    const ct=CATS[cat];
    el.innerHTML+=`<div class="listsec" style="color:${ct?.color||'#3a4e7a'}">${ct?.label||cat}</div>`;
    objs.forEach(obj=>{
      const row=document.createElement('div');
      row.className='objrow'+(obj.id===selectedId?' sel':'');
      row.dataset.id=obj.id;
      const hex=hexColor(obj.col);
      const sub=obj.dist?`${obj.dist} ${v==='stars'?'ly':'AU sim'}`:obj.pos?`${obj.pos.join(', ')} ly`:obj.type||'';
      const ct2=CATS[obj.cat];
      row.innerHTML=`
        <div class="oicon" style="background:${hex}18;color:${hex};border:1px solid ${hex}33;">${getIcon(obj.cat)}</div>
        <div class="oinfo">
          <div class="oname">${obj.name}</div>
          <div class="osub">${obj.cat.toUpperCase()}${obj.moonOf?' · Moon of '+obj.moonOf:''}</div>
        </div>
        <div class="otype-badge" style="background:${ct2?.bg||'#8899aa22'};color:${ct2?.color||'#aaa'}">${ct2?.label||obj.cat}</div>`;
      row.addEventListener('click',()=>selectObj(obj.id));
      el.appendChild(row);
    });
  });
}

function getIcon(cat){
  const icons={star:'★',planet:'●',moon:'◐',dwarf:'◉',asteroid:'✦',comet:'☄',kuiper:'❄',interstellar:'↗',nebula:'❊',galaxy:'⬡',blackhole:'◈'};
  return icons[cat]||'·';
}

function selectObj(id){
  selectedId=id;
  // update list highlight
  document.querySelectorAll('.objrow').forEach(r=>r.classList.toggle('sel',r.dataset.id===id));

  // find data
  const allData=[...DB.solar,...DB.outer,...DB.stars,...DB.deep];
  const d=allData.find(x=>x.id===id);
  if(!d)return;

  // info panel
  const ct=CATS[d.cat];
  document.getElementById('i-type').textContent=(ct?.label||d.cat)+' — '+d.name;
  document.getElementById('i-type').style.color=ct?.color||'#5ecfda';
  document.getElementById('i-name').textContent=d.name.toUpperCase();
  document.getElementById('i-fact').textContent=d.fact||'';

  const sg=document.getElementById('i-stats');
  sg.innerHTML='';
  if(d.stats) Object.entries(d.stats).forEach(([l,v])=>{
    sg.innerHTML+=`<div class="statbox"><div class="slbl">${l}</div><div class="sv">${v}</div></div>`;
  });

  const sc=document.getElementById('i-subs');
  sc.innerHTML='';
  if(d.subs&&d.subs.length){
    d.subs.forEach(s=>{
      const c=document.createElement('div');
      c.className='subchip'; c.textContent=s;
      const found=[...DB.solar,...DB.outer,...DB.stars,...DB.deep].find(x=>x.name===s||x.id===s.toLowerCase().replace(/\s/g,'_'));
      if(found) c.addEventListener('click',()=>selectObj(found.id));
      sc.appendChild(c);
    });
  }

  // if focus lock, move camera
  const m=allMeshMap[id];
  if(focusLocked&&m) controls.target.copy(m.position);
}

const viewCams={
  solar:{pos:[0,28,62],  target:[0,0,0]},
  outer:{pos:[0,35,90],  target:[0,0,0]},
  stars:{pos:[0,40,90],  target:[0,0,0]},
  deep: {pos:[0,50,120], target:[0,0,0]},
};

window.setView=function(v){
  currentView=v;
  Object.entries(groups).forEach(([k,g])=>g.visible=k===v);
  ['solar','outer','stars','deep'].forEach(t=>{
    document.getElementById('tab-'+t).classList.toggle('active',t===v);
  });
  const c=viewCams[v];
  camera.position.set(...c.pos);
  controls.target.set(...c.target);
  controls.update();
  buildCatBar(v);
  buildObjList(v);
  // auto-select first object
  const first=getAllForView(v)[0];
  if(first) selectObj(first.id);
  // toggle sim clock visibility
  document.querySelector('.simclock').style.opacity=v==='solar'?'1':'0.4';
};

// RAYCASTER
// ════════════════════════════════════════════════════
const ray=new THREE.Raycaster();
ray.params.Points={threshold:.5};
const mouse=new THREE.Vector2();
const tip=document.getElementById('tip');

function getClickTargets(){
  const grp=groups[currentView];
  const targets=[];
  grp.traverse(obj=>{if(obj.isMesh&&obj.userData.id)targets.push(obj);});
  return targets;
}

renderer.domElement.addEventListener('mousemove',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(getClickTargets(),false);
  if(hits.length){
    const id=hits[0].object.userData.id;
    const d=[...DB.solar,...DB.outer,...DB.stars,...DB.deep].find(x=>x.id===id);
    tip.style.display='block';
    tip.style.left=(e.clientX-renderer.domElement.getBoundingClientRect().left+14)+'px';
    tip.style.top=(e.clientY-renderer.domElement.getBoundingClientRect().top-8)+'px';
    tip.textContent=(d?.name||id).toUpperCase()+(d?.dist?' — '+(currentView==='stars'?d.dist+' ly':d.dist+' AU'):'');
    renderer.domElement.style.cursor='pointer';
  } else {
    tip.style.display='none';
    renderer.domElement.style.cursor='crosshair';
  }
});

renderer.domElement.addEventListener('click',e=>{
  const r=renderer.domElement.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;
  mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  const hits=ray.intersectObjects(getClickTargets(),false);
  if(hits.length){
    selectObj(hits[0].object.userData.id);
    const rip=document.createElement('div');
    rip.className='ripple';
    rip.style.left=(e.clientX-r.left)+'px';
    rip.style.top=(e.clientY-r.top)+'px';
    cwrap.appendChild(rip);
    setTimeout(()=>rip.remove(),600);
  }
});

// ANIMATION
// ════════════════════════════════════════════════════
const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);
  const days=eDays();
  const t=performance.now()*.001;

  // Solar orbits
  DB.solar.forEach(p=>{
    if(!p.period)return;
    const m=allMeshMap[p.id];if(!m)return;
    let angle=oAngle(days,p.period);
    if(p.moonOf){
      // moon: orbit around parent
      const parent=DB.solar.find(x=>x.name===p.moonOf);
      if(parent){
        const pm=allMeshMap[parent.id];
        if(pm){
          const moonDist=p.dist-parent.dist+.5;
          m.position.set(pm.position.x+Math.cos(angle)*moonDist,0,pm.position.z+Math.sin(angle)*moonDist);
          if(m.userData.label) m.userData.label={};
          return;
        }
      }
    }
    m.position.set(Math.cos(angle)*p.dist,0,Math.sin(angle)*p.dist);
    m.rotation.y+=.002;
  });

  // Outer orbits
  DB.outer.forEach(p=>{
    if(!p.period||!p.dist)return;
    const m=allMeshMap[p.id];if(!m)return;
    const angle=oAngle(days,p.period);
    const tilt=p.orbitTilt||0;
    const x=Math.cos(angle)*p.dist;
    const z=Math.sin(angle)*p.dist;
    const y=Math.sin(angle)*p.dist*Math.sin(tilt);
    m.position.set(x,y,z);
    m.rotation.y+=.001;
  });

  // Update comet tails
  if(showTails){
    cometTails.forEach(({line,mesh,col})=>{
      if(!mesh.parent||!mesh.parent.visible)return;
      const pos=mesh.position;
      const toSun=new THREE.Vector3().sub(pos).normalize();
      const pts=[];
      for(let i=0;i<40;i++){
        const spread=i*.08;
        pts.push(new THREE.Vector3(
          pos.x+(toSun.x+( Math.random()-.5)*spread)*i*.4,
          pos.y+(toSun.y+( Math.random()-.5)*spread)*i*.1,
          pos.z+(toSun.z+( Math.random()-.5)*spread)*i*.4
        ));
      }
      line.geometry.setFromPoints(pts);
      line.geometry.attributes.position.needsUpdate=true;
    });
  }

  // Star pulses
  if(currentView==='stars'){
    DB.stars.forEach(s=>{
      const m=allMeshMap[s.id];if(!m)return;
      const pulse=1+.04*Math.sin(t+s.dist);
      m.scale.setScalar(pulse);
    });
  }

  // Nebula slow rotation
  if(currentView==='deep'){
    DB.deep.forEach(d=>{
      const m=allMeshMap[d.id];if(!m)return;
      if(d.cat==='nebula') m.rotation.y+=.0005;
      if(d.cat==='galaxy') m.rotation.y+=.0002;
      if(d.cat==='blackhole'){m.rotation.y+=.003;m.rotation.z+=.001;}
    });
  }

  // Clock
  document.getElementById('ck-d').textContent=Math.floor(days).toLocaleString();
  document.getElementById('ck-y').textContent=(days/365.25).toFixed(2);

  // Focus lock
  if(focusLocked&&selectedId){
    const m=allMeshMap[selectedId];
    if(m) controls.target.lerp(m.position,.08);
  }

  controls.update();
  renderer.render(scene,camera);
  labelR.render(scene,camera);
}

// RESIZE
function resize(){
  const w=cwrap.clientWidth,h=cwrap.clientHeight;
  camera.aspect=w/h;camera.updateProjectionMatrix();
  renderer.setSize(w,h);labelR.setSize(w,h);
}
window.addEventListener('resize',resize);resize();

// BOOT
setView('solar');
animate();
</script>
</body>
</html>
